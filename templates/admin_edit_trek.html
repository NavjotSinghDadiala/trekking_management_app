{% extends 'base.html' %}

{% block title %}Edit Trek - TrekManager{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <div class="card-body">
                <!-- Header -->
                <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-sm btn-outline-secondary me-3 rounded-pill">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                    <h3 class="fw-bold mb-0 text-success"><i class="bi bi-pencil-square me-1"></i>Edit Trek Details</h3>
                </div>

                <form method="POST">
                    <!-- Name & Location -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-semibold">Trek Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ trek.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="location" class="form-label fw-semibold">Location / Region</label>
                            <input type="text" class="form-control" id="location" name="location" value="{{ trek.location }}" required>
                        </div>
                    </div>

                    <!-- Difficulty & Duration -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="difficulty" class="form-label fw-semibold">Difficulty Level</label>
                            <select class="form-select" id="difficulty" name="difficulty" required>
                                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy (Beginner Trails)</option>
                                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate (Medium Ascent)</option>
                                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard (Alpine/High Altitude)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="duration" class="form-label fw-semibold">Duration (in Days)</label>
                            <input type="number" class="form-control" id="duration" name="duration" min="1" value="{{ trek.duration }}" required>
                        </div>
                    </div>

                    <!-- Dates -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="start_date" class="form-label fw-semibold">Start Date</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" value="{{ trek.start_date }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="end_date" class="form-label fw-semibold">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" value="{{ trek.end_date }}" required>
                        </div>
                    </div>

                    <!-- Capacity & Price -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="max_slots" class="form-label fw-semibold">Maximum Slots (Capacity)</label>
                            <input type="number" class="form-control" id="max_slots" name="max_slots" min="1" value="{{ trek.max_slots }}" required>
                            <div class="form-text text-muted">Currently available slots: {{ trek.available_slots }}</div>
                        </div>
                        <div class="col-md-6">
                            <label for="price" class="form-label fw-semibold">Price per Trekker (₹)</label>
                            <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" value="{{ trek.price }}" required>
                        </div>
                    </div>

                    <!-- Assigned Staff & Status -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="assigned_staff_id" class="form-label fw-semibold">Assigned Staff Guide</label>
                            <select class="form-select" id="assigned_staff_id" name="assigned_staff_id">
                                <option value="">-- No Guide Assigned Yet --</option>
                                {% for guide in approved_guides %}
                                    <option value="{{ guide.id }}" {% if trek.assigned_staff_id == guide.id %}selected{% endif %}>
                                        {{ guide.staff_profile.name }} ({{ guide.username }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label fw-semibold">Trek Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending Approval</option>
                                <option value="Approved" {% if trek.status == 'Approved' %}selected{% endif %}>Approved</option>
                                <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open (Accepting Bookings)</option>
                                <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                                <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                            </select>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                        <button type="submit" class="btn btn-success px-4 rounded-pill fw-semibold shadow-sm">
                            <i class="bi bi-check-circle-fill me-1"></i>Save Changes
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
