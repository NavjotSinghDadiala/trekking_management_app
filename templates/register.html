{% extends 'base.html' %}

{% block title %}Register - TrekManager{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-success fs-1"></i>
                    <h2 class="mt-2 fw-bold text-dark">Create Account</h2>
                    <p class="text-muted">Start your trekking journey or join as a guide</p>
                </div>
                
                <form method="POST">
                    <!-- Username Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create password" required>
                        </div>
                    </div>

                    <!-- Role Dropdown Selector -->
                    <div class="mb-4">
                        <label for="role" class="form-label fw-semibold">Register As</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                            <select class="form-select" id="role" name="role" required>
                                <option value="user" selected>User (Trekker) - Immediate Access</option>
                                <option value="staff">Staff (Guide) - Requires Admin Approval</option>
                            </select>
                        </div>
                        <div class="form-text text-muted mt-1">
                            <i class="bi bi-info-circle me-1"></i>Staff accounts cannot log in until approved by an administrator.
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg rounded-pill fw-semibold">
                            <i class="bi bi-check-circle-fill me-2"></i>Register
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <p class="mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-success fw-bold">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
